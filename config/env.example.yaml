# LLM API 設定
# コピーして config/env.yaml を作成し、実際の値を記入すること。
# config/env.yaml は .gitignore に含め、リポジトリにコミットしないこと。

# --- Gemini（Google AI）OpenAI 互換エンドポイント ---
# https://ai.google.dev/gemini-api/docs/openai-compatible
llm:
  api_key: ""              # Google AI Studio の API キー（AIza...）
  base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
  model: "gemini-2.0-flash"

